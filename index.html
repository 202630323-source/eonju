<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분배의 정석 - AI 학습 우선순위 최적화</title>
    <!-- Chart.js & html2pdf.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0A0C0E;
            --card-bg: #14181D;
            --card-border: #222933;
            --accent-orange: #FF5E36;
            --accent-orange-glow: rgba(255, 94, 54, 0.25);
            --text-main: #F0F3F7;
            --text-muted: #8A96A3;
            --input-bg: #1C222B;
            --success: #10B981;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 헤더 디자인 */
        header {
            text-align: center;
            padding: 16px 0 8px 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--accent-orange);
            filter: drop-shadow(0 0 8px var(--accent-orange));
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* 메인 그리드 레이아웃 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .main-grid {
                grid-template-columns: 360px 1fr;
            }
        }

        /* 카드 공통 스타일 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .card-title i {
            color: var(--accent-orange);
        }

        /* 폼 입력 요소 */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 2px var(--accent-orange-glow);
        }

        /* 슬라이더 컨트롤 */
        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-slider {
            flex: 1;
            accent-color: var(--accent-orange);
            height: 5px;
            background: var(--input-bg);
            border-radius: 5px;
        }

        .range-value {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-orange);
            width: 24px;
            text-align: right;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 버튼 스타일 */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-orange);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-orange-glow);
            margin-top: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-outline:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        /* 우선순위 리스트 카드 */
        .task-item {
            background-color: var(--input-bg);
            border-left: 4px solid var(--accent-orange);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .task-item:hover {
            transform: translateX(3px);
        }

        .task-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .task-tags {
            display: flex;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .badge-high { background-color: rgba(255, 94, 54, 0.2); color: #FF5E36; }
        .badge-mid { background-color: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        .badge-low { background-color: rgba(16, 185, 129, 0.2); color: #10B981; }

        .task-score {
            text-align: right;
        }

        .score-num {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-orange);
        }

        .score-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #6B7280;
            cursor: pointer;
            padding: 4px 8px;
            margin-left: 8px;
        }

        .delete-btn:hover {
            color: #EF4444;
        }

        /* 차트 영역 */
        .chart-container {
            position: relative;
            height: 180px;
            width: 100%;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .empty-state i {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
            opacity: 0.5;
        }

        /* PDF 저장용 스타일 */
        #pdf-export-area {
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: var(--radius);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 헤더 -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-fire-flame-curved"></i>
            <span>분배의 정석</span>
        </div>
        <p class="subtitle">모든 요소(난이도·성적·흥미도)를 고려한 AI 학습 우선순위 솔루션</p>
    </header>

    <div class="main-grid">
        <!-- 1. 과목 정보 입력 섹션 (초기 대화 프롬프트 요소 전체 포함) -->
        <div class="card">
            <div class="card-title">
                <span><i class="fa-solid fa-sliders"></i> 과목 데이터 입력</span>
            </div>
            
            <form id="taskForm">
                <div class="form-group">
                    <label for="subjectName">과목 / 과제명</label>
                    <input type="text" id="subjectName" class="form-control" placeholder="예: 수학 I 기말고사 준비" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="importance">중요도 (1-10)</label>
                        <div class="range-container">
                            <input type="range" id="importance" class="range-slider" min="1" max="10" value="5" oninput="updateVal('impVal', this.value)">
                            <span id="impVal" class="range-value">5</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="urgency">긴급도 (1-10)</label>
                        <div class="range-container">
                            <input type="range" id="urgency" class="range-slider" min="1" max="10" value="5" oninput="updateVal('urgVal', this.value)">
                            <span id="urgVal" class="range-value">5</span>
                        </div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="difficulty">예상 난이도 (1-10)</label>
                        <div class="range-container">
                            <input type="range" id="difficulty" class="range-slider" min="1" max="10" value="5" oninput="updateVal('diffVal', this.value)">
                            <span id="diffVal" class="range-value">5</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="interest">흥미 및 집중도 (1-10)</label>
                        <div class="range-container">
                            <input type="range" id="interest" class="range-slider" min="1" max="10" value="5" oninput="updateVal('intVal', this.value)">
                            <span id="intVal" class="range-value">5</span>
                        </div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="prevScore">전 성적 (점수/등급)</label>
                        <input type="number" id="prevScore" class="form-control" placeholder="예: 65 (점수)" min="0" max="100">
                    </div>
                    <div class="form-group">
                        <label for="deadline">남은 마감일 (일)</label>
                        <input type="number" id="deadline" class="form-control" placeholder="예: 7" min="1" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> 우선순위 분석 및 추가
                </button>
            </form>
        </div>

        <!-- 2. 결과 리스트 및 차트 섹션 -->
        <div id="pdf-export-area">
            <div class="card" style="margin-bottom: 16px;">
                <div class="card-title">
                    <span><i class="fa-solid fa-list-check"></i> 최적화된 학습 우선순위</span>
                    <button class="btn btn-outline" onclick="exportToPDF()">
                        <i class="fa-solid fa-file-pdf"></i> PDF 저장
                    </button>
                </div>

                <div id="taskList">
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        등록된 과목이 없습니다.<br>왼쪽에서 과목 정보를 입력해 보세요.
                    </div>
                </div>
            </div>

            <!-- 시각적 그래프 (간결하게 유지) -->
            <div class="card">
                <div class="card-title">
                    <span><i class="fa-chart-simple"></i> 학습 시간 분배 비중</span>
                </div>
                <div class="chart-container">
                    <canvas id="priorityChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('distribution_tasks')) || [];
    let priorityChart = null;

    function updateVal(id, val) {
        document.getElementById(id).innerText = val;
    }

    // 우선순위 산식 (확정된 가중치 및 논의된 산식 반영)
    function calculatePriorityScore(importance, urgency, difficulty, interest, prevScore, deadline) {
        // 기본 척도 변환
        const impWeight = importance * 3.5;    // 중요도 (최대 35점)
        const urgWeight = urgency * 2.5;       // 긴급도 (최대 25점)
        const diffWeight = difficulty * 1.5;   // 난이도 높을수록 가중치 (최대 15점)
        
        // 전 성적이 낮을수록(보완 필요) 우선순위 상승 (최대 15점)
        const scoreNeed = prevScore !== "" ? ((100 - parseFloat(prevScore)) / 100) * 15 : 7.5;
        
        // 흥미도가 낮을수록 우선순위 배치 필요성 가중치 및 디데이 가중치 (최대 10점)
        const interestGap = (11 - interest) * 0.5;
        const deadlineBonus = Math.max(0, (15 - deadline) * 0.5);

        let total = impWeight + urgWeight + diffWeight + scoreNeed + interestGap + deadlineBonus;
        return Math.min(100, Math.round(total));
    }

    // 과목 추가 처리
    document.getElementById('taskForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('subjectName').value;
        const importance = parseInt(document.getElementById('importance').value);
        const urgency = parseInt(document.getElementById('urgency').value);
        const difficulty = parseInt(document.getElementById('difficulty').value);
        const interest = parseInt(document.getElementById('interest').value);
        const prevScore = document.getElementById('prevScore').value;
        const deadline = parseInt(document.getElementById('deadline').value);

        const score = calculatePriorityScore(importance, urgency, difficulty, interest, prevScore, deadline);

        const newTask = {
            id: Date.now(),
            name,
            importance,
            urgency,
            difficulty,
            interest,
            prevScore: prevScore || '-',
            deadline,
            score
        };

        tasks.push(newTask);
        saveAndRender();
        this.reset();
        
        // 슬라이더 기본값 리셋
        ['impVal', 'urgVal', 'diffVal', 'intVal'].forEach(id => document.getElementById(id).innerText = '5');
    });

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        // 점수 내림차순 정렬
        tasks.sort((a, b) => b.score - a.score);
        localStorage.setItem('distribution_tasks', JSON.stringify(tasks));
        renderList();
        renderChart();
    }

    function renderList() {
        const listEl = document.getElementById('taskList');
        if (tasks.length === 0) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-folder-open"></i>
                    등록된 과목이 없습니다.<br>왼쪽에서 과목 정보를 입력해 보세요.
                </div>`;
            return;
        }

        listEl.innerHTML = tasks.map(t => {
            let badgeClass = 'badge-low';
            let badgeText = '하';
            if (t.score >= 75) { badgeClass = 'badge-high'; badgeText = '최상'; }
            else if (t.score >= 55) { badgeClass = 'badge-mid'; badgeText = '상'; }

            return `
                <div class="task-item">
                    <div class="task-info">
                        <h4>${t.name} <span class="badge ${badgeClass}">${badgeText}</span></h4>
                        <div class="task-tags">
                            <span>D-${t.deadline}</span> • 
                            <span>난이도 ${t.difficulty}</span> • 
                            <span>전성적: ${t.prevScore}점</span>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div class="task-score">
                            <div class="score-num">${t.score}</div>
                            <div class="score-label">우선순위 점수</div>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${t.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderChart() {
        const ctx = document.getElementById('priorityChart').getContext('2d');
        
        if (priorityChart) priorityChart.destroy();

        if (tasks.length === 0) return;

        priorityChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: tasks.map(t => t.name),
                datasets: [{
                    label: '우선순위 점수',
                    data: tasks.map(t => t.score),
                    backgroundColor: '#FF5E36',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#8A96A3' }, grid: { display: false } },
                    y: { ticks: { color: '#8A96A3' }, grid: { color: '#222933' }, min: 0, max: 100 }
                }
            }
        });
    }

    // PDF 저장 함수
    function exportToPDF() {
        const element = document.getElementById('pdf-export-area');
        const opt = {
            margin:       10,
            filename:     '분배의정석_학습우선순위_리포트.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, backgroundColor: '#0A0C0E' },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // 초기 실행 시 예시 데이터 삽입 (텅 비어있을 때 사용자의 이해를 돕기 위함)
    if (tasks.length === 0) {
        tasks = [
            { id: 1, name: "수학 I 기말고사 대비", importance: 9, urgency: 8, difficulty: 9, interest: 4, prevScore: "62", deadline: 5, score: 88 },
            { id: 2, name: "영어 단어 암기", importance: 6, urgency: 7, difficulty: 4, interest: 7, prevScore: "85", deadline: 3, score: 64 }
        ];
        saveAndRender();
    } else {
        saveAndRender();
    }
</script>
</body>
</html>
